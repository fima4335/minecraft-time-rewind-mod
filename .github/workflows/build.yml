name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-rewind-mod
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release with JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Time Rewind Mod v1.1.0 (Multiplayer)
          body: |
            **JAR для Minecraft 1.21.1 + Fabric** — работает в одиночной и на сервере.

            **Установка:**
            1. Скачай `time-rewind-mod-1.1.0.jar` (не sources)
            2. Положи в `mods` на **клиенте и на сервере**
            3. Нужен Fabric API
            4. Клавиша **R** — меню времени

            Сохраняет позицию, здоровье, инвентарь (у каждого игрока свой список).
            Время суток меняется только в одиночке или если есть OP.
          files: build/libs/time-rewind-mod-1.1.0.jar
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
