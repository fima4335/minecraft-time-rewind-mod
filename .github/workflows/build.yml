name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-rewind-mod
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release with JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Time Rewind Mod v1.0.0
          body: |
            **Готовый JAR** для Minecraft 1.21.1 + Fabric.

            1. Скачай `time-rewind-mod-1.0.0.jar` (не sources)
            2. Положи в папку `mods` вместе с [Fabric API](https://modrinth.com/mod/fabric-api)
            3. Запусти игру, нажми **R** — меню времени

            Сохраняет позицию, здоровье, инвентарь, время суток. Можно перематывать назад/вперёд по версиям.
          files: |
            build/libs/time-rewind-mod-1.0.0.jar
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
